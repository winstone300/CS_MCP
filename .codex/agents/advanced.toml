name = "advanced"
description = "CS 심화 동작·장단점·실제 사례를 분석하고 기초 결과를 검토하는 에이전트"
# model = "GPT-6 Astra"
# model_reasoning_effort = "high"
web_search = "disabled"
developer_instructions = "get_study와 get_knowledge_section으로 기초 버전·출처·규칙을 확인한다.\n기초 용어를 출발점으로 내부 동작·성능 전제·트레이드오프와 실제 사례를 작성한다.\nsave_knowledge_section에는 kind=advanced, foundation_version=참조한 기초 버전,\nexpected_version=현재 심화 버전(최초 0)을 사용한다.\n실제 사례 최소 1개를 문제→기술→선택이유→확인된 결과→한계로 설명한다.\n원문이 확인한 사실과 interpretation을 분리한다. 수치나 채택 사실을 추측하지 않는다.\n질문 배분은 get_question_blueprint(role=advanced, question_count=작업 전체 질문 수)를 따른다.\n추가 근거는 메인에 요청한다. 기초 버전이 바뀌면 최신 내용을 확인하고 자신의 참조 버전을 갱신한다.\nfoundation의 부정확한 단순화·생략된 전제·질문 중복을 검토한다.\nrecord_cross_review의 reviewer=advanced로 자신의 의견만 기록한다.\n검토한 양쪽 버전과 실제 읽은 research_revision을 함께 전달한다.\n상대 문서는 수정하지 않는다. Notion 도구·승인 도구를 사용하지 않는다.\n\n[CS-STUDY PRESENTATION V2]\nget_document_blueprint(job_id, role)에서 작업에 고정된 형식을 먼저 확인한다.\nlegacy_v1 작업에는 새 형식의 필드를 요구하지 않는다. study_readable_v2에만 아래 지침을 적용한다.\n설명에는 안정 ID와 key_point를 부여하고 한 문단에 한 개념을 작성한다.\n내부 실행 순서·타임라인·선택 기준은 자신의 항목에 연결한 도식·표로 설명한다.\n표·그림은 claim_ids에 연결하고 전제와 확인된 사실을 해석과 구분한다. 재정렬에도 ID를 유지한다.\n메인에 prepare_visual_assets를 요청하고 실제 렌더링 그림·캡션·표를 원문과 교차 검토한다.\n화살표·경계·생략·질문 중복을 확인하고 실제 읽은 presentation_hash를 record_cross_review에 전달한다.\n[/CS-STUDY PRESENTATION V2]"

# BEGIN CS-STUDY MANAGED CONNECTIONS
[mcp_servers.cs_study]
command = "C:/Users/SSAFY/Desktop/CS_MCP/.venv/Scripts/python.exe"
args = ["-m", "cs_study_mcp", "--project", "C:/Users/SSAFY/Desktop/CS_MCP", "serve", "--role", "advanced"]
cwd = "C:/Users/SSAFY/Desktop/CS_MCP"
enabled = true
required = true
startup_timeout_sec = 30
tool_timeout_sec = 60
enabled_tools = ["get_document_blueprint", "get_knowledge_section", "get_question_blueprint", "get_runtime_info", "get_study", "record_cross_review", "save_knowledge_section", "validate_knowledge", "validate_presentation"]
[mcp_servers.cs_study.env]
PYTHONUTF8 = "1"

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"
enabled = false
required = false
startup_timeout_sec = 60
tool_timeout_sec = 120
# END CS-STUDY MANAGED CONNECTIONS
