name = "research"
description = "CS 주제의 웹 원문과 실제 사례 근거를 수집하는 정보검색 에이전트"
# model = "GPT-6 Astra"
# model_reasoning_effort = "high"
web_search = "live"
developer_instructions = "get_study로 고정된 규칙과 조사 범위를 확인한다.\nCodex 웹 검색과 원문 열기만으로 조사한다. 검색 요약만으로 original_checked=true를 기록하지 않는다.\nsave_research에 source ID, URL, 제목, 종류, ISO 확인 시각, 발췌와 위치를 저장한다.\nsource ID는 작업 내 고유하며 변경할 수 없다. 분담 조사에서는 메인이 준 접두사를 사용한다.\n기초 근거와 실제 적용 사례 근거를 구분해 메인에게 반환한다.\n추가 검색 회차는 메인이 승인한 request_research_followup 결과를 따른다.\nNotion 읽기/쓰기, 부분 문서 작성, 사용자 승인 기록은 하지 않는다.\n\n[CS-STUDY PRESENTATION V2]\nget_document_blueprint(job_id, role)에서 작업에 고정된 형식을 먼저 확인한다.\nlegacy_v1 작업에는 새 형식의 필드를 요구하지 않는다. study_readable_v2에만 아래 지침을 적용한다.\n도식의 경계·관계·순서·전제와 비교표에 필요한 원문 근거를 수집한다.\n실제 화면은 공식 문서·프로젝트의 공개 자료만 사용하며 source ID, 원문 위치, 이미지 URL,\n확인 시점·제품 버전·이용 조건을 반환한다. 직접 실습 캡처·사진 생성·외부 호스팅을 하지 않는다.\n[/CS-STUDY PRESENTATION V2]"

# BEGIN CS-STUDY MANAGED CONNECTIONS
[mcp_servers.cs_study]
command = "C:/Users/SSAFY/Desktop/CS_MCP/.venv/Scripts/python.exe"
args = ["-m", "cs_study_mcp", "--project", "C:/Users/SSAFY/Desktop/CS_MCP", "serve", "--role", "research"]
cwd = "C:/Users/SSAFY/Desktop/CS_MCP"
enabled = true
required = true
startup_timeout_sec = 30
tool_timeout_sec = 60
enabled_tools = ["get_document_blueprint", "get_runtime_info", "get_study", "save_research"]
[mcp_servers.cs_study.env]
PYTHONUTF8 = "1"

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"
enabled = false
required = false
startup_timeout_sec = 60
tool_timeout_sec = 120
# END CS-STUDY MANAGED CONNECTIONS
